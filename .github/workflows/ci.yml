name: C validation
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with GCC
        run: make CC=gcc all test
      - name: Build with Clang
        run: |
          make clean
          make CC=clang all test
      - name: CLI smoke test
        run: |
          ./sudoku-tester validate examples/valid.sdk --mode 11 --format json | grep -q '"valid":true'
          ./sudoku-tester validate examples/valid.sdk --mode 27 --format json | grep -q '"valid":true'
          ./sudoku-tester validate examples/valid.sdk --mode pool --threads 2 --format json | grep -q '"valid":true'
          ./sudoku-tester benchmark --iterations 2 --format csv | grep -q 27-thread
          status=0
          ./sudoku-tester validate examples/invalid.sdk --format json || status=$?
          test "$status" -eq 1
          status=0
          ./sudoku-tester validate examples/incomplete.sdk --format json || status=$?
          test "$status" -eq 1
          status=0
          ./sudoku-tester batch examples/ || status=$?
          test "$status" -eq 1

      - name: Public synthetic concurrency CLI smoke
        run: |
          ./concurrency-lab run --mode atomic --jobs 32 --work 4 --threads 2 | grep -q 'mode=atomic'
          ./concurrency-lab compare --jobs 65 --work 5 --threads 4 --profile skewed --seed 42 | grep -q MATCH
          ./concurrency-lab benchmark --jobs 32 --work 4 --threads 2 --trials 2 | grep -q mutex
      - name: Swarm cross-domain correctness and CLI smoke
        run: |
          ./swarm-lab compare --model bees --agents 64 --steps 5 --threads 4 | grep -q MATCH
          ./swarm-lab compare --model traffic --agents 65 --steps 5 --threads 4 | grep -q MATCH
          ./swarm-lab compare --model phase --agents 16 --steps 3 --threads 4 | grep -q MATCH
          ./swarm-lab compare --model life --agents 64 --steps 5 --threads 4 | grep -q MATCH
          ./swarm-lab run --model phase --agents 16 --steps 2 --scheduler atomic | grep -q phase_order
          ./swarm-lab benchmark --model traffic --agents 64 --steps 2 --threads 2 --trials 2 | grep -q mutex
          status=0
          ./swarm-lab compare --model life --agents 30 --steps 1 || status=$?
          test "$status" -eq 2
